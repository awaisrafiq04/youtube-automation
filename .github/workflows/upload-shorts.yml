name: Upload YouTube Shorts

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of queued videos to upload
        required: false
        default: "2"
        type: string
      repeat:
        description: Rotate and re-upload existing rows
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: upload-youtube-shorts
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Upload queued Shorts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: shorts-videos
          CHANNEL_TOKEN_ENCRYPTION_KEY: ${{ secrets.CHANNEL_TOKEN_ENCRYPTION_KEY }}
          DASHBOARD_USER_ID: ${{ secrets.DASHBOARD_USER_ID }}
        run: >-
          python scripts/upload.py
          --count "${{ inputs.count }}"
          ${{ inputs.repeat && '--repeat' || '' }}
