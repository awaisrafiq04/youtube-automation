name: Publish OAuth information site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure dashboard
        env:
          DASHBOARD_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          DASHBOARD_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "supabaseUrl": os.environ.get("DASHBOARD_SUPABASE_URL", ""),
              "supabasePublishableKey": os.environ.get("DASHBOARD_SUPABASE_KEY", ""),
              "bucket": "shorts-videos",
          }
          Path("docs/config.js").write_text("window.APP_CONFIG=" + json.dumps(config) + ";\n")
          PY

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
